# The package's "ID card": its name, version, description and which other packages it needs.
# Python's installer (pip) and the Python package index read this file.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signatomics"
version = "0.1.0"
description = "Python tools for Olink (PEA) proteomics data: read, quality control, bridging, statistics and biomarker signatures, with every step reported."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Elena Stamatelou" }]
# Search words on the Python package index; the name is the family, these say what it does today
keywords = ["olink", "proteomics", "npx", "pea", "proximity extension assay", "olink target 96",
            "olink explore", "biomarkers", "quality control", "bridging", "batch correction",
            "biomarker signature", "machine learning", "differential abundance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",          # statistics (signatomics.stats)
    "scikit-learn",   # biomarker signature (signatomics.signature)
    "plotly",         # every chart
    "openpyxl",       # Excel files (.xlsx)
    "pyarrow",        # parquet files (Explore HT / Reveal)
]

[project.urls]
Documentation = "https://signatomics.elenastamatelou.com"
Source = "https://github.com/ElenaStamatelou/signatomics"
Issues = "https://github.com/ElenaStamatelou/signatomics/issues"

[project.optional-dependencies]
# olink: kept so that the older install line  pip install "signatomics[olink]"  still works
olink = []
dev = ["pytest"]                  # for running the automatic tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"signatomics.olink" = ["data/*.csv"]   # the example NPX file

[tool.pytest.ini_options]
testpaths = ["tests"]
