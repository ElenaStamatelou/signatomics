# Builds the documentation website (website/) and publishes it on GitHub Pages,
# at https://signatomics.elenastamatelou.com. Runs on every push to main that touches the website.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:          # also a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r website/requirements.txt
      - run: mkdocs build --strict -f website/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
