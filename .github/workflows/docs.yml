# Builds the documentation website (website/) and publishes it on GitHub Pages,
# at https://signatomics.elenastamatelou.com. Runs when a release is published on GitHub, together
# with release.yml (PyPI), so the website always matches the version people can install.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: docs

on:
  release:
    types: [published]
  workflow_dispatch:          # also a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r website/requirements.txt
      - run: mkdocs build --strict -f website/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
