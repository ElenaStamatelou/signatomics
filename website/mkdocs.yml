# The documentation website: https://signatomics.elenastamatelou.com
# Preview on your own computer:   mkdocs serve -f website/mkdocs.yml   → http://127.0.0.1:8000
# Published by .github/workflows/docs.yml on every push to main.

site_name: signatomics
site_url: https://signatomics.elenastamatelou.com/
site_description: Python tools for Olink (PEA) proteomics data. Read, check and bridge your data, with every step reported.
site_author: Elena Stamatelou
repo_url: https://github.com/ElenaStamatelou/signatomics
repo_name: signatomics
edit_uri: ""
copyright: "© 2026 <a href='https://elenastamatelou.com'>Elena Stamatelou</a>"

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  icon:
    logo: signatomics/mark
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/signatomics.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:          # shared diagrams: --8<-- "bridging.html"
      base_path: [website/snippets, snippets]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Recipes: how-to/index.md
  - Reference:
      - reference/index.md
      - Reading: reference/reading.md
      - Sample information: reference/samples.md
      - Quality: reference/quality.md
      - Bridging plates: reference/bridging.md
  - About: about.md
