# The documentation website: https://signatomics.elenastamatelou.com
# Preview on your own computer:   mkdocs serve -f website/mkdocs.yml   → http://127.0.0.1:8000
# Published by .github/workflows/docs.yml on every push to main.

site_name: signatomics
site_url: https://signatomics.elenastamatelou.com/
site_description: Python tools for Olink (PEA) proteomics data. Read, quality control, bridging and sample metadata, with every step reported.
site_author: Elena Stamatelou
# GitHub link with stars/forks in the header: Elena wants it ALWAYS kept (standing rule, 15 Oct 2026)
repo_url: https://github.com/ElenaStamatelou/signatomics
repo_name: signatomics
edit_uri: ""
copyright: "© 2026 <a href='https://elenastamatelou.com'>Elena Stamatelou</a>"

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  language: en
  font:
    text: Public Sans
    code: JetBrains Mono
  palette:
    - scheme: default            # light by default; the toggle switches to dark
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  icon:
    logo: signatomics/mark
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    # navigation.instant left out: it kept the old page after a click (clashes with the charts)
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips          # hover a term (NPX, LOD, ...) for its meaning

extra_css:
  - assets/stylesheets/signatomics.css

extra_javascript:
  - assets/javascripts/charts.js   # interactive charts, loaded only when visible

markdown_extensions:
  - abbr                       # glossary: website/snippets/glossary.md
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:          # shared diagrams: --8<-- "bridging.html"
      base_path: [website/snippets, snippets]
      check_paths: true
      auto_append: [glossary.md]
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Start: start.md
  - Guides:
      - guides/index.md
      - Preprocessing:
          - Data import: guides/data-import.md
          - Quality control: guides/quality-control.md
          - Bridging: guides/bridging.md
          - Sample metadata: guides/sample-metadata.md
      - "Example: a full analysis": guides/example-analysis.md
  - Reference:
      - reference/index.md
      - Preprocessing:
          - In one call: reference/prepare.md
          - Data import: reference/reading.md
          - Quality control: reference/quality.md
          - Bridging: reference/bridging.md
          - Sample metadata: reference/samples.md
  - About: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ElenaStamatelou/signatomics
      name: signatomics on GitHub
