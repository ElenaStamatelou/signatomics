<figcaption>Whatever the NPX file looks like (long or wide format; .csv, .txt, .xlsx or .parquet), every
function works on the same table in long format, with Olink's column names. In blue: one measurement.
In the wide file its details sit in different places; in long format they share one row. All other
Olink columns (OlinkID, UniProt, Panel, ...) are kept. Values are synthetic.</figcaption>
