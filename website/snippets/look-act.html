  <path class="d-line" d="M100 110 H551"/>
  <path class="d-line" d="M569 110 H678"/>

    <rect class="d-cell" x="40" y="75" width="20" height="13"/><rect class="d-cell" x="60" y="75" width="20" height="13"/><rect class="d-cell" x="80" y="75" width="20" height="13"/>
    <rect class="d-cell" x="40" y="88" width="20" height="13"/><rect class="d-cell" x="60" y="88" width="20" height="13"/><rect class="d-cell" x="80" y="88" width="20" height="13"/>
